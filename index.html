<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小腾的主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1218' stroke='%234da6ff' stroke-width='3'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%234da6ff' font-family='sans-serif'%3E腾%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
  :root {
    --bg: #0d1218;
    --bg-soft: #131a21;
    --line: #22303c;
    --ink: #e6edf2;
    --muted: #8a99a6;
    --accent: #4da6ff;
    --accent-dim: rgba(77, 166, 255, .1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.7;
    font-size: 16px;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== 顶栏 ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 880px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .site-name {
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: #c9e4ff;
    text-shadow: 0 0 6px rgba(77, 166, 255, .55), 0 0 16px rgba(77, 166, 255, .3);
  }
  nav { display: flex; gap: 4px; }
  nav a {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 15px;
    color: var(--muted);
    transition: color .15s, background-color .15s, text-shadow .15s;
  }
  nav a:hover { color: var(--ink); background: var(--bg-soft); }
  nav a.active {
    color: var(--accent);
    font-weight: 600;
    background: var(--accent-dim);
    text-shadow: 0 0 10px rgba(77, 166, 255, .45);
  }

  /* ===== 视图容器 ===== */
  main { max-width: 880px; margin: 0 auto; padding: 40px 20px 60px; }
  .view { display: none; }
  .view.active { display: block; animation: viewIn .35s ease-out; }

  /* ===== 首页 ===== */
  .home {
    padding-top: 56px;
    text-align: center;
  }
  .home h1 {
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    font-weight: 700;
    font-size: clamp(36px, 6.5vw, 56px);
    letter-spacing: 3px;
    color: #d8ecff;
    text-shadow:
      0 0 8px rgba(77, 166, 255, .7),
      0 0 22px rgba(77, 166, 255, .45),
      0 0 60px rgba(77, 166, 255, .25);
  }
  .home .sub {
    margin: 20px auto 0;
    max-width: 420px;
    color: var(--muted);
    font-size: 16px;
  }
  .home .go-chat {
    display: inline-block;
    margin-top: 36px;
    padding: 11px 30px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    background: var(--accent-dim);
    font-size: 16px;
    letter-spacing: 1px;
    box-shadow: 0 0 16px rgba(77, 166, 255, .22), inset 0 0 10px rgba(77, 166, 255, .06);
    transition: background-color .2s, color .2s, box-shadow .2s, transform .15s;
    animation: breathe 3s ease-in-out infinite;
  }
  .home .go-chat:hover {
    background: var(--accent);
    color: #0d1218;
    box-shadow: 0 0 30px rgba(77, 166, 255, .6), inset 0 0 12px rgba(14, 20, 18, .2);
    transform: translateY(-1px);
  }

  /* 首页入场：标题、副标题、按钮依次浮现 */
  .view.in h1, .view.in .sub, .view.in .go-chat {
    animation: rise .55s ease-out both;
  }
  .view.in .sub { animation-delay: .12s; }
  .view.in .go-chat { animation-delay: .24s; }

  /* ===== 聊天室 ===== */
  .chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .chat-head h2 {
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    font-size: 20px;
    font-weight: 700;
    color: #c9e4ff;
    text-shadow: 0 0 8px rgba(77, 166, 255, .4);
  }
  .chat-head .open-out {
    font-size: 13px;
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 6px;
    transition: color .15s, background-color .15s;
  }
  .chat-head .open-out:hover {
    color: var(--accent);
    background: var(--accent-dim);
  }
  .chat-frame {
    width: 100%;
    height: calc(100vh - 160px);
    min-height: 480px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-soft);
    display: block;
    box-shadow: 0 0 24px rgba(77, 166, 255, .08);
  }

  /* ===== 交流群 ===== */
  .group { padding-top: 24px; text-align: center; }
  .group h2 {
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    font-size: 28px;
    font-weight: 700;
    color: #c9e4ff;
    text-shadow: 0 0 10px rgba(77, 166, 255, .4);
  }
  .group .group-num {
    margin: 26px 0 8px;
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    font-size: clamp(34px, 8vw, 52px);
    font-weight: 700;
    letter-spacing: 3px;
    color: #d8ecff;
    text-shadow:
      0 0 8px rgba(77, 166, 255, .7),
      0 0 22px rgba(77, 166, 255, .45),
      0 0 55px rgba(77, 166, 255, .25);
  }
  .group p { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .group .copy-btn {
    display: inline-block;
    margin-top: 26px;
    padding: 10px 26px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    background: var(--accent-dim);
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 16px rgba(77, 166, 255, .22), inset 0 0 10px rgba(77, 166, 255, .06);
    transition: background-color .2s, color .2s, box-shadow .2s, transform .15s;
  }
  .group .copy-btn:hover {
    background: var(--accent);
    color: #0d1218;
    box-shadow: 0 0 28px rgba(77, 166, 255, .55), inset 0 0 12px rgba(13, 18, 24, .2);
    transform: translateY(-1px);
  }
  .view.in h2, .view.in .group-num, .view.in .copy-btn {
    animation: rise .5s ease-out both;
  }

  /* ===== 关于 ===== */
  .about h2 {
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 18px;
    color: #c9e4ff;
    text-shadow: 0 0 10px rgba(77, 166, 255, .4);
  }
  .about p { margin-bottom: 10px; }
  .about .to-chat {
    color: var(--accent);
    font-weight: 600;
  }
  .about .to-chat:hover { text-decoration: underline; }

  /* ===== 页脚 ===== */
  footer {
    max-width: 880px;
    margin: 0 auto;
    padding: 18px 20px 30px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* ===== 动画 ===== */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes viewIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 16px rgba(77, 166, 255, .22), inset 0 0 10px rgba(77, 166, 255, .06); }
    50%      { box-shadow: 0 0 26px rgba(77, 166, 255, .38), inset 0 0 10px rgba(77, 166, 255, .1); }
  }

  @media (max-width: 520px) {
    main { padding-top: 28px; }
    .bar { padding: 8px 14px; }
    .home { padding-top: 40px; }
    .chat-frame { height: calc(100vh - 150px); min-height: 420px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a href="#/home" class="site-name">小腾</a>
    <nav>
      <a href="#/home" data-view="home">首页</a>
      <a href="#/chat" data-view="chat">聊天室</a>
      <a href="#/group" data-view="group">交流群</a>
      <a href="#/about" data-view="about">关于</a>
    </nav>
  </div>
</header>

<main>
  <!-- ===== 视图：首页 ===== -->
  <section class="view home" id="view-home">
    <h1>我是小腾</h1>
    <p class="sub">这个站现在只有一样东西：聊天室。进来聊两句吧。</p>
    <a class="go-chat" href="#/chat">进聊天室</a>
  </section>

  <!-- ===== 视图：聊天室 ===== -->
  <section class="view" id="view-chat">
    <div class="chat-head">
      <h2>聊天室</h2>
      <a class="open-out" href="http://47.92.211.180:8080/" target="_blank" rel="noopener">新窗口打开</a>
    </div>
    <iframe class="chat-frame" src="http://47.92.211.180:8080/" title="聊天室"></iframe>
  </section>

  <!-- ===== 视图：交流群 ===== -->
  <section class="view group" id="view-group">
    <h2>QQ C++ 交流群</h2>
    <div class="group-num">1128639237</div>
    <p>在 QQ 里搜这个群号就能加进来。</p>
    <button class="copy-btn" onclick="copyGroup(this)">复制群号</button>
  </section>

  <!-- ===== 视图：关于 ===== -->
  <section class="view about" id="view-about">
    <h2>关于</h2>
    <p>我是小腾，这是我自己的主页。</p>
    <p>现在站里只有一个聊天室，以后想到什么再往这放。</p>
    <p>有什么想说的，去<a class="to-chat" href="#/chat">聊天室</a>喊一声就行。</p>
  </section>
</main>

<footer>
  <span>小腾的主页</span>
  <span>2026</span>
</footer>

<script>
  var views = ["home", "chat", "group", "about"];

  function copyGroup(btn) {
    var num = "1128639237";
    var ok = function () {
      var old = btn.textContent;
      btn.textContent = "已复制";
      setTimeout(function () { btn.textContent = old; }, 2000);
    };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = num;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(num).then(ok, fallback);
    } else {
      fallback();
    }
  }

  function replay(viewEl) {
    viewEl.classList.remove("in");
    void viewEl.offsetWidth;
    viewEl.classList.add("in");
  }

  function route() {
    var target = (location.hash || "").replace(/^#\//, "") || "home";
    if (views.indexOf(target) === -1) target = "home";

    views.forEach(function (name) {
      var el = document.getElementById("view-" + name);
      if (el) el.classList.toggle("active", name === target);
    });

    var links = document.querySelectorAll('nav a[data-view]');
    links.forEach(function (a) {
      var active = a.getAttribute("data-view") === target;
      a.classList.toggle("active", active);
      if (active) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });

    replay(document.getElementById("view-" + target));
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>

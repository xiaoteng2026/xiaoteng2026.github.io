<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>软件分享站</title>
<style>
body{
    font-family: "Microsoft YaHei", sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:40px 15px;
    color:#333;
}
.box{
    width:640px;
    max-width:100%;
    margin:0 auto;
    background:#fff;
    padding:35px 40px;
    border:1px solid #ddd;
}
h1{
    font-size:20px;
    font-weight:normal;
    margin:0 0 5px 0;
}
.date{
    font-size:12px;
    color:#999;
    margin-bottom:25px;
}
.search{
    margin-bottom:25px;
}
.search input{
    width:70%;
    padding:8px;
    border:1px solid #ccc;
    font-size:14px;
    font-family:inherit;
    outline:none;
}
.search input:focus{
    border-color:#666;
}
.search button{
    padding:8px 20px;
    border:1px solid #ccc;
    background:#eee;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    margin-left:-5px;
}
.search button:hover{
    background:#ddd;
}
.item{
    padding:15px 0;
    border-bottom:1px solid #eee;
}
.item h2{
    font-size:16px;
    font-weight:normal;
    margin:0 0 8px 0;
}
.item h2 a{
    color:#1a5fb4;
    text-decoration:none;
}
.item h2 a:hover{
    text-decoration:underline;
}
.item .info{
    font-size:13px;
    color:#888;
    margin-bottom:8px;
}
.item .info span{
    margin-right:18px;
}
.item p{
    font-size:13px;
    color:#555;
    line-height:1.8;
    margin:0 0 10px 0;
}
.item .dl{
    font-size:13px;
}
.item .dl a{
    color:#1a5fb4;
    text-decoration:none;
}
.item .dl a:hover{
    text-decoration:underline;
}
.item .code{
    color:#c00;
    font-weight:bold;
}
.empty{
    text-align:center;
    padding:50px 0;
    color:#999;
    font-size:14px;
}
.foot{
    margin-top:35px;
    padding-top:15px;
    border-top:1px solid #eee;
    font-size:12px;
    color:#bbb;
    text-align:center;
}
</style>
</head>
<body>

<div class="box">
    <h1>软件分享站</h1>
    <div class="date">更新于 2025-01-15</div>

    <div class="search">
        <input type="text" id="kw" placeholder="输入关键词搜索">
        <button onclick="searchIt()">搜索</button>
    </div>

    <div id="main">

        <div class="item">
            <h2><a href="https://yun.139.com/shareweb/#/w/i/2ygb7wmcMSB36" target="_blank">安卓 5.1.1</a></h2>
            <div class="info">
                <span>大小：待补充</span>
                <span>下载量：0 次</span>
            </div>
            <p>安卓 5.1.1 系统镜像/刷机包。中国移动云盘分享，提取码 <span class="code">w7c2</span>。</p>
            <div class="dl">
                <a href="https://yun.139.com/shareweb/#/w/i/2ygb7wmcMSB36" target="_blank">下载地址 →</a>
                <span style="color:#888;">（提取码：<span class="code">w7c2</span>）</span>
            </div>
        </div>

        <div class="item">
            <h2><a href="https://www.mediafire.com/file/93u1tms5xv7bf2a/SP970.zip/file" target="_blank">SP970 刷机包</a></h2>
            <div class="info">
                <span>大小：450 MB</span>
                <span>下载量：0 次</span>
            </div>
            <p>适用于 SP970 设备的完整固件包，包含系统镜像和刷机工具。刷机前请备份好数据，保持电量充足。</p>
            <div class="dl">
                <a href="https://www.mediafire.com/file/93u1tms5xv7bf2a/SP970.zip/file" target="_blank">下载地址 →</a>
            </div>
        </div>

    </div>

    <div class="foot">软件分享站</div>
</div>

<script>
// 存一下原始列表，搜索没结果之后好还原
var mainBox = document.getElementById('main');
var oldHTML = mainBox.innerHTML;

function searchIt(){
    var word = document.getElementById('kw').value.trim().toLowerCase();

    // 空的话直接还原
    if(word === ''){
        mainBox.innerHTML = oldHTML;
        return;
    }

    // 关键词匹配
    if(word.indexOf('安卓') !== -1 || word.indexOf('5.1') !== -1 || word.indexOf('android') !== -1 ||
       word.indexOf('sp970') !== -1 || word.indexOf('刷机') !== -1 || word.indexOf('固件') !== -1){
        mainBox.innerHTML = oldHTML;
    } else {
        mainBox.innerHTML = '<div class="empty">没找到相关内容</div>';
    }
}

// 回车也能搜
document.getElementById('kw').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
        searchIt();
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>软件分享站</title>
<style>
body{
    font-family: "Microsoft YaHei", sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:40px 15px;
    color:#333;
}
.box{
    width:640px;
    max-width:100%;
    margin:0 auto;
    background:#fff;
    padding:35px 40px;
    border:1px solid #ddd;
}
h1{
    font-size:20px;
    font-weight:normal;
    margin:0 0 5px 0;
}
.date{
    font-size:12px;
    color:#999;
    margin-bottom:25px;
}
.search{
    margin-bottom:25px;
}
.search input{
    width:70%;
    padding:8px;
    border:1px solid #ccc;
    font-size:14px;
    font-family:inherit;
    outline:none;
}
.search input:focus{
    border-color:#666;
}
.search button{
    padding:8px 20px;
    border:1px solid #ccc;
    background:#eee;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    margin-left:-5px;
}
.search button:hover{
    background:#ddd;
}
.item{
    padding:15px 0;
    border-bottom:1px solid #eee;
}
.item h2{
    font-size:16px;
    font-weight:normal;
    margin:0 0 8px 0;
}
.item h2 a{
    color:#1a5fb4;
    text-decoration:none;
}
.item h2 a:hover{
    text-decoration:underline;
}
.item .info{
    font-size:13px;
    color:#888;
    margin-bottom:8px;
}
.item .info span{
    margin-right:18px;
}
.item p{
    font-size:13px;
    color:#555;
    line-height:1.8;
    margin:0 0 10px 0;
}
.item .dl{
    font-size:13px;
}
.item .dl a{
    color:#1a5fb4;
    text-decoration:none;
}
.item .dl a:hover{
    text-decoration:underline;
}
.item .code{
    color:#c00;
    font-weight:bold;
}
.empty{
    text-align:center;
    padding:50px 0;
    color:#999;
    font-size:14px;
}
.foot{
    margin-top:35px;
    padding-top:15px;
    border-top:1px solid #eee;
    font-size:12px;
    color:#bbb;
    text-align:center;
}
</style>
</head>
<body>

<div class="box">
    <h1>软件分享站</h1>
    <div class="date" id="updateDate"></div>

    <div class="search">
        <input type="text" id="kw" placeholder="输入关键词搜索">
        <button onclick="searchIt()">搜索</button>
    </div>

    <div id="main"></div>

    <div class="foot">软件分享站</div>
</div>

<script>
// 数据直接写这儿，加资源就往数组里塞一个
var data = {
    updateDate: "2026-10-16",
    items: [
        {
            name: "jz02.zip",
            url: "https://1827460910.share.123pan.cn/123pan/V3t0jv-MqO4A?pwd=1145",
            code: "1145",
            size: "待补充",
            downloads: 0,
            keywords: "jz02 jz 02 zip 包",
            desc: "来自123云盘用户15816403975的分享，文件名 jz02.zip。"
        },
        {
            name: "酷安广大网友提供（大部分包）",
            url: "https://1816092521.share.123pan.cn/123pan/iDQ5Vv-0FbuA?pwd=nFY",
            code: "nFY",
            size: "待补充",
            downloads: 0,
            keywords: "酷安 大部分 123 合集",
            desc: "酷安网友分享的合集包，123 云盘不限速下载。"
        },
        {
            name: "安卓 5.1.1",
            url: "https://yun.139.com/shareweb/#/w/i/2ygb7wmcMSB36",
            code: "w7c2",
            size: "待补充",
            downloads: 0,
            keywords: "安卓 android 5.1 系统 镜像",
            desc: "安卓 5.1.1 系统镜像/刷机包，中国移动云盘分享。"
        },
        {
            name: "SP970 刷机包",
            url: "https://www.mediafire.com/file/93u1tms5xv7bf2a/SP970.zip/file",
            code: "",
            size: "450 MB",
            downloads: 0,
            keywords: "sp970 刷机 固件",
            desc: "适用于 SP970 设备的完整固件包，包含系统镜像和刷机工具。刷机前请备份好数据，保持电量充足。"
        }
    ]
};

var allItems = data.items;
var mainBox = document.getElementById('main');
document.getElementById('updateDate').textContent = '更新于 ' + data.updateDate;

function renderList(items){
    if(items.length === 0){
        mainBox.innerHTML = '<div class="empty">没找到相关内容</div>';
        return;
    }

    var html = '';
    items.forEach(function(item){
        var codeHtml = item.code ? '（提取码：<span class="code">' + item.code + '</span>）' : '';
        var sizeHtml = item.size ? '<span>大小：' + item.size + '</span>' : '<span>大小：待补充</span>';
        var dlCount = item.downloads ? item.downloads + ' 次' : '0 次';

        html += '<div class="item">';
        html += '<h2><a href="' + item.url + '" target="_blank">' + item.name + '</a></h2>';
        html += '<div class="info">';
        html += sizeHtml;
        html += '<span>下载量：' + dlCount + '</span>';
        html += '</div>';
        html += '<p>' + item.desc + '</p>';
        html += '<div class="dl">';
        html += '<a href="' + item.url + '" target="_blank">下载地址 →</a> ';
        html += codeHtml;
        html += '</div>';
        html += '</div>';
    });

    mainBox.innerHTML = html;
}

function searchIt(){
    var word = document.getElementById('kw').value.trim().toLowerCase();

    if(word === ''){
        renderList(allItems);
        return;
    }

    var filtered = allItems.filter(function(item){
        var text = (item.name + ' ' + item.desc + ' ' + (item.keywords || '')).toLowerCase();
        return text.indexOf(word) !== -1;
    });

    renderList(filtered);
}

document.getElementById('kw').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
        searchIt();
    }
});

renderList(allItems);
</script>

</body>
</html>
